name: Deploy to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create .env file
        run: |
          cat <<EOF > .env
          # Set "DEBUG=False" for production
          DEBUG=${{ vars.DEBUG }}

          # Get a secure secret key from https://djecrety.ir
          SECRET_KEY=${{ secrets.SECRET_KEY }}

          # Don't use "*" for ALLOWED_HOSTS in production
          ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}

          CSRF_TRUSTED_ORIGINS=${{ vars.CSRF_TRUSTED_ORIGINS }}

          TIME_ZONE=${{ vars.TIME_ZONE }}

          # Database Configuration
          DB_INIT_PASSWORD=${{ secrets.DB_INIT_PASSWORD }}
          DB_ENGINE=${{ vars.DB_ENGINE }}
          DB_NAME=${{ vars.DB_NAME_v2 }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT }}
          EOF

      - name: Copy files to server
        run: |
          rsync -avz --exclude='.git' --exclude='.github' --exclude='media/' --exclude='staticfiles/' --exclude='__pycache__/' --exclude='*.pyc' -e "ssh -o StrictHostKeyChecking=no" . ${{ vars.SSH_USER }}@${{ vars.SERVER_IP }}:/srv/${{ vars.APP_NAME }}_v2/

      - name: Deploy with docker-compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.SSH_USER }}@${{ vars.SERVER_IP }} << 'ENDSSH'
          cd /srv/${{ vars.APP_NAME }}_v2
          docker compose --profile production pull
          docker compose --profile production up --build -d web-production
          docker compose --profile production exec -T web-production python manage.py migrate
          docker compose --profile production exec -T web-production python manage.py collectstatic --noinput
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.SSH_USER }}@${{ vars.SERVER_IP }} "docker ps | grep web-production"
